# Non-monetary relationships. Money edges come from transactions.yaml.
# kind:
#   family     - family tie (context; carries no implication of benefit)
#   role       - office, employment or founder relationship
#   ownership  - equity or controlling interest
#   business   - commercial agreement without a disclosed amount (licence, partnership)
#   policy     - an actor's documented policy decision or proposal
#   oversight  - a congressional inquiry, letter or report about the target
#   reported   - relationship asserted by credible reporting but not independently confirmed
#   inference  - analytical inference (never drawn as fact)
# claims: the claim(s) whose evidence supports this edge. Every edge needs at least one.
# An edge never implies that one entity caused the other to benefit.

