# Financial amounts. One row per distinct amount, typed so unlike amounts are never summed.
#
# category: revenue | profit | investment-capital | asset-value | net-worth-estimate |
#   loan-principal | contract-value | government-expenditure | market-valuation |
#   realized-gain | unrealized-appreciation | potential-benefit | sale-proceeds |
#   political-contribution | charitable-donation | in-kind-gift | proposed-funding
# status: paid | committed | disclosed | reported | estimated | proposed | announced
#   (a commitment is not money received; "disclosed" = appears in an official filing as reported)
# from/to: entity ids; `from` may be omitted only when hide_edge is true (payer not modelled).
# hide_edge: true keeps the amount in the dashboard but draws no map edge.
# amount_low/amount_high: in `currency` units; equal when a single figure is reported.
# part_of: this amount is a component of another row and must not be added to it.
# personal_benefit: whether evidence shows the amount benefited Trump or a family member personally.
#   proven | partial | unproven | none
# dedupe_key: one real-world transaction → one key, however many outlets report it.

