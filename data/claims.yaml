# Claims (findings). Each claim is one checkable statement.
#
# classification (how well the statement itself is established):
#   verified | corroborated | reported | disputed | unverified | inference
# connection (what the evidence shows about money and policy — see METHODOLOGY.md):
#   policy-decision        1. a documented policy decision
#   financial-relationship 2. a documented financial relationship
#   economic-benefit       3. a documented direct or indirect economic benefit
#   plausible-unproven     4. a plausible but unproven connection
#   no-connection          5. no established financial connection
# track: timeline lane — policy | financial | oversight | diplomacy | analysis
#   (financial and policy events are shown in separate lanes; adjacency is not causation)
# confidence: high | medium | low
# sources[].quote is only filled where the source has access: reviewed.
# Wording rule: statements attribute contested figures to whoever published them.

# ═══ US policy toward Israel ═══════════════════════════════════════════════

- id: C-001
  track: policy
  title: Trump recognized Jerusalem as Israel's capital and ordered the embassy moved
  statement: On December 6, 2017, President Trump signed Proclamation 9683 recognizing Jerusalem as the capital of Israel and directing the relocation of the US Embassy from Tel Aviv to Jerusalem.
  topics: [israel-policy]
  regions: [Israel, United States]
  entities: [donald-trump, p-jerusalem, israel]
  event_date: 2017-12-06
  classification: verified
  connection: policy-decision
  confidence: high
  limitations: Establishes the decision only. It says nothing about motive or about any financial benefit to anyone.
  sources:
    - id: S-001
      locator: "82 FR 58331 (Vol. 82, No. 236, Dec. 11, 2017)"
      quote: "I have determined that it is time for the United States to officially recognize Jerusalem as the capital of Israel."
    - id: S-002
      locator: White House archive, full text

- id: C-002
  track: policy
  title: The interim embassy in Jerusalem was scheduled to open on May 14, 2018
  statement: The State Department told Congress that an interim US embassy in Jerusalem, housed in an existing consular facility in the Arnona neighborhood, would open on May 14, 2018, coinciding with the 70th anniversary of Israel's independence.
  topics: [israel-policy]
  regions: [Israel]
  entities: [p-jerusalem, us-state-dept]
  event_date: 2018-05-14
  classification: corroborated
  connection: policy-decision
  confidence: high
  limitations: The sources here pre-date the opening and describe the plan. The opening itself is widely reported but is not separately sourced in this register.
  sources:
    - id: S-076
      locator: AP report, Feb 2018
    - id: S-079
      locator: Newsweek, Feb 23, 2018
  related: [C-001, C-003]

